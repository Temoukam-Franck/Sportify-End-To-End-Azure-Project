# The main pipeline for sportify_db

resources:
  pipelines:
    sportify_db_etl:
      name: sportify_db_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../src/sportify_db_etl"

      libraries:
        - glob:
            include: ../src/sportify_db_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}

# This is a Declarative Automation Bundle definition for sportify_db.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sportify_db
  uuid: 023b8e85-e6e7-4bc2-a569-27582ccaec40

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405619814771002.2.azuredatabricks.net:443
    variables:
      catalog: temoukamdb
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405619814771002.2.azuredatabricks.net:443
      # We explicitly deploy to /Workspace/Users/chiedembrenda@yahoo.com to make sure we only have a single copy.
      root_path: /Workspace/Users/chiedembrenda@yahoo.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: temoukamdb
      schema: prod
    permissions:
      - user_name: chiedembrenda@yahoo.com
        level: CAN_MANAGE
